spring:
  application:
    name: adr-manager-api
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/adr_manager}
    username: ${DB_USERNAME:adr_manager}
    password: ${DB_PASSWORD:adr_manager}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/adr-manager}
management:
  endpoint:
    health:
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs
app:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:adr-manager}
    client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:adr-manager-api}
    client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:dev-api-client-secret}
